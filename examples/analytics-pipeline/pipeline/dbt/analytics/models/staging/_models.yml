version: 2

models:
  - name: stg_orders
    description: One row per order, deduplicated on the latest ingestion watermark.
    columns:
      - name: order_id
        description: Primary key.
        tests: [unique, not_null]
      - name: customer_id
        description: Foreign key to stg_customers.
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: ['placed', 'shipped', 'delivered', 'returned', 'cancelled']
      - name: net_revenue
        description: gross_revenue less the line discount.
        tests: [not_null]

  - name: stg_customers
    description: One row per customer, deduplicated on the latest ingestion watermark.
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: customer_segment
        tests:
          - accepted_values:
              values: ['consumer', 'smb', 'enterprise']
