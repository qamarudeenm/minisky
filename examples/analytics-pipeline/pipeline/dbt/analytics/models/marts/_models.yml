version: 2

models:
  - name: dim_customers
    description: Customer dimension with lifetime order metrics.
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: lifetime_orders
        tests: [not_null]

  - name: fct_orders
    description: Order-grain fact table.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id

  - name: fct_daily_revenue
    description: Daily revenue, order counts and average order value.
    columns:
      - name: order_date
        tests: [unique, not_null]
      - name: net_revenue
        tests: [not_null]
