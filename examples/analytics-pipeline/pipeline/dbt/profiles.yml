# dbt profile for the MiniSky-emulated warehouse.
#
# The adapter is the stock dbt-bigquery adapter. Two things make it talk to
# MiniSky instead of Google, and both live outside this file:
#   • minisky_bq_shim.py in the dbt virtualenv points the client at
#     MINISKY_ENDPOINT and swaps in anonymous credentials;
#   • terraform writes MINISKY_* into /opt/pipeline/env.sh.
#
# Delete the shim and set real credentials and this same project runs against
# BigQuery proper — the models never change.
minisky_analytics:
  target: local
  outputs:
    local:
      type: bigquery
      method: oauth
      project: "{{ env_var('MINISKY_PROJECT', 'retail-analytics-local') }}"
      dataset: "{{ env_var('BQ_DATASET_STAGING', 'retail_staging') }}"
      location: US
      threads: 1
      priority: interactive
      job_execution_timeout_seconds: 300
      job_retries: 0
